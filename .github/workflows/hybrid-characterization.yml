name: OPT-HYBRID-001 characterization

# A diagnostic research workflow, not a performance-threshold gate.
on:
  pull_request:
    paths:
      - 'examples/hybrid_execution.py'
      - 'examples/pareto_frontier.py'
      - 'scripts/benchmark_hybrid_execution.py'
      - 'tests/test_hybrid_execution.py'
      - 'tests/test_hybrid_characterization.py'
      - '.github/workflows/hybrid-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run focused hybrid regressions
        run: python3 -I -m unittest discover -s tests -p 'test_hybrid*.py' -v
      - name: Run optional synthetic characterization (no timing threshold)
        run: |
          status=0
          python3 -I scripts/benchmark_hybrid_execution.py --workers 7 --repetitions 2 > "$RUNNER_TEMP/hybrid-report.json" || status=$?
          cat "$RUNNER_TEMP/hybrid-report.json"
          exit "$status"
