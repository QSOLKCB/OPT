name: test

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  inventory-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run ZIP inventory regression tests
        run: python3 -m unittest discover -s tests -v
